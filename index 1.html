<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="筋トレの基本を簡単に紹介するページです。">
  <title>筋トレ入門</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic", sans-serif;
      color: #222;
      background: #f4f6f8;
      line-height: 1.7;
    }
    header {
      padding: 64px 20px;
      color: white;
      text-align: center;
      background: #2563eb;
    }
    header h1 { margin: 0 0 10px; font-size: 2.3rem; }
    header p { margin: 0; }
    main { width: min(760px, calc(100% - 32px)); margin: 32px auto; }
    section {
      margin-bottom: 24px;
      padding: 24px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,.06);
    }
    h2 { margin-top: 0; color: #1d4ed8; }
    .menu { display: grid; gap: 12px; }
    .item { padding: 14px; border-left: 5px solid #2563eb; background: #eff6ff; }
    footer { padding: 24px; color: #666; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>筋トレ入門</h1>
    <p>無理なく続けるための簡単なポイント</p>
  </header>

  <main>
    <section>
      <h2>筋トレの目的</h2>
      <p>筋トレは、筋力や体力を高めるための運動です。最初から重い負荷を使わず、正しい姿勢を意識して続けることが大切です。</p>
    </section>

    <section>
      <h2>初心者向けメニュー</h2>
      <div class="menu">
        <div class="item"><strong>スクワット</strong><br>10回 × 3セット</div>
        <div class="item"><strong>腕立て伏せ</strong><br>できる回数 × 3セット</div>
        <div class="item"><strong>プランク</strong><br>30秒 × 3セット</div>
      </div>
    </section>

    <section>
      <h2>続けるためのポイント</h2>
      <ul>
        <li>週2～3回を目安にする</li>
        <li>運動前後に軽くストレッチする</li>
        <li>痛みがある場合は無理をしない</li>
        <li>回数や時間を記録する</li>
      </ul>
    </section>
  </main>

  <footer>&copy; 2026 筋トレ入門</footer>
</body>
</html>
